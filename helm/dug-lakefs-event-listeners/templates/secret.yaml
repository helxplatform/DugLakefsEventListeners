{{- if and .Values.hook.token (not .Values.hook.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "listener.hookSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "listener.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hook.existingSecretKey }}: {{ .Values.hook.token | quote }}
{{- end }}
