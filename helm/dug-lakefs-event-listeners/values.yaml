# Deploy the listener. Exposed so search-chart can gate the dependency.
enabled: true

replicaCount: 1

image:
  # Built FROM the roger image so the airflow CLI and DB drivers match the
  # deployment being triggered (see Dockerfile).
  repository: containers.renci.org/helxplatform/duglakefseventlisteners
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8001

airflow:
  # The listener triggers via `airflow dags trigger`, which writes through
  # the metadata DB rather than the REST API -- the FAB auth manager offers
  # no token endpoint to authenticate against. So it needs the same
  # connection string the scheduler uses.
  metadataSecret:
    name: ""                 # e.g. "search-metadata"; required
    key: connection
  home: /opt/airflow

hook:
  # Shared secret checked against the X-Roger-Token header. Must match
  # ROGER_HOOK_TOKEN in the *lakeFS server's* environment, which is where
  # the action's {{ ENV.ROGER_HOOK_TOKEN }} is resolved.
  token: ""
  # Or reference a secret you manage yourself.
  existingSecret: ""
  existingSecretKey: token

dags:
  # Any repository not listed falls through to this DAG.
  default: annotate_and_index
  # Repository -> DAG. KGX repos belong here if you ever want them wired;
  # they are deliberately left out of the installed actions by default.
  # map:
  #   heal-mds-kgx: knowledge_graph_build
  map: {}

# One run per source commit; only used when an event carries no commit id.
dedupMinutes: 0

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
